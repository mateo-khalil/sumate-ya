# Team management: equipos permanentes, invitaciones, disponibilidad horaria
# Issue #137 — admin-equipos-capitan
#
# Decision Context:
# - Opción A arquitectónica: tabla teams separada de tournamentTeams porque
#   tournamentTeams.tournamentId NOT NULL la acopla a un torneo específico.
#   Los equipos permanentes existen independientemente de torneos.
# - TeamRosterEntry (no TeamMember): evita conflicto con TeamMember definido en match.graphql
#   (que representa un jugador dentro de los equipos A/B de un partido).
# - MatchFormat y PlayerPosition son enums ya definidos en match.graphql y profile.graphql.
# - Previously fixed bugs: none relevant.

enum InvitationStatus {
  PENDING
  ACCEPTED
  REJECTED
  EXPIRED
}

enum TeamMemberRole {
  CAPTAIN
  MEMBER
}

type TeamProfile {
  id: ID!
  displayName: String!
  avatarUrl: String
  preferredPosition: PlayerPosition
}

type Team {
  id: ID!
  name: String!
  captainId: ID
  captain: TeamProfile
  logoUrl: String
  format: MatchFormat!
  description: String
  isActive: Boolean!
  memberCount: Int!
  members: [TeamRosterEntry!]!
  createdAt: String!
  updatedAt: String!
}

type TeamRosterEntry {
  id: ID!
  teamId: ID!
  player: TeamProfile!
  role: TeamMemberRole!
  joinedAt: String!
}

type TeamInvitation {
  id: ID!
  team: Team!
  invitedPlayer: TeamProfile!
  invitedBy: TeamProfile!
  status: InvitationStatus!
  message: String
  expiresAt: String!
  respondedAt: String
  createdAt: String!
}

type AvailabilityMatrixCell {
  dayOfWeek: Int!
  startTime: String!
  availableCount: Int!
  availablePlayers: [TeamProfile!]!
}

# Franja de disponibilidad del jugador autenticado para un equipo
type PlayerAvailabilitySlot {
  id: ID!
  dayOfWeek: Int!
  startTime: String!
  endTime: String!
  isRecurrent: Boolean!
}

input CreateTeamInput {
  name: String!
  format: MatchFormat!
  description: String
}

input UpdateTeamInput {
  teamId: ID!
  name: String
  logoUrl: String
  format: MatchFormat
  description: String
}

input InvitePlayerInput {
  teamId: ID!
  playerId: ID!
  message: String
}

input RespondInvitationInput {
  invitationId: ID!
  accept: Boolean!
}

input AvailabilitySlotInput {
  dayOfWeek: Int!
  startTime: String!
  endTime: String!
}

input SetAvailabilityInput {
  teamId: ID!
  slots: [AvailabilitySlotInput!]!
}

type TeamResult {
  success: Boolean!
  message: String!
  team: Team
}

type TeamMutationResult {
  success: Boolean!
  message: String!
}

type TeamInvitationResult {
  success: Boolean!
  message: String!
  invitation: TeamInvitation
}

# Resultado de inscripción de equipo a torneo (F10)
type EnrollTeamResult {
  success: Boolean!
  message: String!
  # Advertencias de disponibilidad — informativas, no bloquean la inscripción
  warnings: [String!]!
}

# Inscripción de un equipo permanente en un torneo
type TeamEnrollment {
  id: ID!
  teamId: ID!
  tournamentId: ID!
  tournamentName: String!
  tournamentStatus: TournamentStatus!
  format: MatchFormat!
  teamCount: Int!
  enrolledAt: String!
}

extend type Query {
  myTeams: [Team!]!
  team(id: ID!): Team
  myPendingInvitations: [TeamInvitation!]!
  teamAvailabilityMatrix(teamId: ID!): [AvailabilityMatrixCell!]!
  # Búsqueda de jugadores para invitar (mín 2 chars, máx 10 resultados)
  searchPlayers(search: String!): [TeamProfile!]!
  # Búsqueda de equipos permanentes por nombre (para invitar a torneos — T5)
  searchTeams(search: String!): [Team!]!
  # Listado de invitaciones enviadas para un equipo (solo capitán)
  teamInvitations(teamId: ID!): [TeamInvitation!]!
  # Disponibilidad personal del usuario autenticado para un equipo
  myTeamAvailability(teamId: ID!): [PlayerAvailabilitySlot!]!
  # Torneos en los que el equipo está inscripto
  teamEnrollments(teamId: ID!): [TeamEnrollment!]!
}

extend type Mutation {
  createTeam(input: CreateTeamInput!): TeamResult!
  updateTeam(input: UpdateTeamInput!): TeamResult!
  deleteTeam(teamId: ID!): TeamMutationResult!
  invitePlayer(input: InvitePlayerInput!): TeamInvitationResult!
  cancelInvitation(invitationId: ID!): TeamMutationResult!
  respondInvitation(input: RespondInvitationInput!): TeamMutationResult!
  claimCaptain(teamId: ID!): TeamResult!
  removeMember(teamId: ID!, playerId: ID!): TeamMutationResult!
  leaveTeam(teamId: ID!): TeamMutationResult!
  setMyAvailability(input: SetAvailabilityInput!): TeamMutationResult!
  # F10: inscribir equipo permanente a un torneo con check de disponibilidad
  enrollTeamInTournament(teamId: ID!, tournamentId: ID!): EnrollTeamResult!
}
