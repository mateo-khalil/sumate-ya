# Profile operations — GraphQL source of truth

query GetMyProfile {
  myProfile {
    id
    displayName
    avatarUrl
    role
    preferredPosition
    division
    matchesPlayed
    matchesWon
    winrate
    isPrivate
  }
}

query GetProfile($id: ID!) {
  profile(id: $id) {
    id
    displayName
    avatarUrl
    role
    preferredPosition
    division
    matchesPlayed
    matchesWon
    winrate
    isPrivate
  }
}

query GetMySettings {
  mySettings {
    isPublic
    showStats
    showHistory
    showPosition
    showDivision
  }
}

mutation UpdatePrivacy($input: UpdatePrivacyInput!) {
  updatePrivacy(input: $input) {
    isPublic
    showStats
    showHistory
    showPosition
    showDivision
  }
}

# Paginated match history for the authenticated player.
# scoreA/scoreB are always null until "registrar resultado" US is implemented.
query GetMyMatches($page: Int, $pageSize: Int) {
  myMatches(page: $page, pageSize: $pageSize) {
    items {
      id
      title
      startTime
      format
      userTeam
      userResult
      scoreA
      scoreB
      isOrganizer
      club {
        id
        name
        zone
      }
    }
    total
    page
    pageSize
    hasMore
  }
}
