# Tournament creation

query GetTournaments {
  tournaments {
    id
    name
    format
    teamCount
    playersPerTeam
    registeredTeamsCount
    status
    description
    startDate
    endDate
    club {
      id
      name
      zone
      address
      imageUrl
    }
  }
}

query GetTournamentDetail($id: ID!) {
  tournament(id: $id) {
    id
    organizerId
    organizer {
      id
      displayName
      avatarUrl
      preferredPosition
    }
    name
    format
    teamCount
    playersPerTeam
    registeredTeamsCount
    status
    description
    startDate
    endDate
    createdAt
    club {
      id
      name
      zone
      address
      imageUrl
    }
    teams {
      id
      name
      captainId
      captain {
        id
        displayName
        avatarUrl
        preferredPosition
      }
      players {
        id
        displayName
        avatarUrl
        preferredPosition
      }
      createdAt
    }
    fixtureMatches {
      id
      tournamentId
      round
      homeTeamId
      awayTeamId
      homeTeam {
        id
        name
      }
      awayTeam {
        id
        name
      }
      courtId
      scheduledAt
      status
      scoreHome
      scoreAway
    }
  }
}

mutation CreateTournament($input: CreateTournamentInput!) {
  createTournament(input: $input) {
    success
    tournamentId
    message
    tournament {
      id
      organizerId
      organizer {
        id
        displayName
        avatarUrl
        preferredPosition
      }
      name
      format
      teamCount
      playersPerTeam
      registeredTeamsCount
      status
      description
      startDate
      endDate
      createdAt
      club {
        id
        name
        zone
        address
        imageUrl
      }
      fixtureMatches {
        id
        tournamentId
        round
        homeTeamId
        awayTeamId
        homeTeam {
          id
          name
        }
        awayTeam {
          id
          name
        }
        courtId
        scheduledAt
        status
        scoreHome
        scoreAway
      }
    }
  }
}

mutation RegisterTournamentTeam($input: RegisterTournamentTeamInput!) {
  registerTournamentTeam(input: $input) {
    success
    teamId
    message
    tournament {
      id
      name
      format
      teamCount
      playersPerTeam
      registeredTeamsCount
      status
      description
      startDate
      endDate
      club {
        id
        name
        zone
        address
        imageUrl
      }
      fixtureMatches {
        id
        tournamentId
        round
        homeTeamId
        awayTeamId
        homeTeam {
          id
          name
        }
        awayTeam {
          id
          name
        }
        courtId
        scheduledAt
        status
        scoreHome
        scoreAway
      }
    }
  }
}
