# Tournament creation

query GetTournaments($filters: TournamentFilters) {
  tournaments(filters: $filters) {
    id
    name
    format
    teamCount
    playersPerTeam
    registeredTeamsCount
    status
    description
    startDate
    endDate
    club {
      id
      name
      zone
      address
      lat
      lng
      imageUrl
    }
  }
}

query GetTournamentDetail($id: ID!) {
  tournament(id: $id) {
    id
    organizerId
    organizer {
      id
      displayName
      avatarUrl
      preferredPosition
    }
    name
    format
    teamCount
    playersPerTeam
    registeredTeamsCount
    status
    description
    startDate
    endDate
    createdAt
    club {
      id
      name
      zone
      address
      lat
      lng
      imageUrl
    }
    teams {
      id
      name
      captainId
      captain {
        id
        displayName
        avatarUrl
        preferredPosition
      }
      players {
        id
        displayName
        avatarUrl
        preferredPosition
      }
      createdAt
    }
    fixtureMatches {
      id
      tournamentId
      round
      homeTeamId
      awayTeamId
      homeTeam {
        id
        name
      }
      awayTeam {
        id
        name
      }
      courtId
      scheduledAt
      status
      scoreHome
      scoreAway
    }
  }
}

query GetTournamentEligiblePlayers($tournamentId: ID!, $search: String) {
  tournamentEligiblePlayers(tournamentId: $tournamentId, search: $search) {
    id
    displayName
    avatarUrl
    preferredPosition
  }
}

